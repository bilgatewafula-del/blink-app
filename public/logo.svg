<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E6FFF"/>
      <stop offset="100%" style="stop-color:#7B2FFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>
  <!-- B letter -->
  <text
    x="256"
    y="340"
    font-family="Arial Black, sans-serif"
    font-size="280"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="-10"
  >B</text>
  <!-- Link dots -->
  <circle cx="150" cy="390" r="22" fill="white" opacity="0.8"/>
  <circle cx="256" cy="415" r="16" fill="white" opacity="0.6"/>
  <circle cx="362" cy="390" r="22" fill="white" opacity="0.8"/>
  <line x1="172" y1="390" x2="240" y2="411" stroke="white" stroke-width="6" opacity="0.6"/>
  <line x1="272" y1="411" x2="340" y2="390" stroke="white" stroke-width="6" opacity="0.6"/>
</svg>